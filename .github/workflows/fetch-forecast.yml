name: Fetch Met Éireann Forecast

on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC = ~07:30 Irish time (covers the 05:30 issue)
    - cron: '30 17 * * *'  # 17:30 UTC = ~18:30 Irish time (covers the ~17:30 issue)
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Leinster forecast
        run: |
          curl -s "https://www.met.ie/Open_Data/json/Leinster.json" \
            -o data/leinster.json \
            --fail \
            --retry 3 \
            --retry-delay 5

      - name: Fetch National forecast
        run: |
          curl -s "https://www.met.ie/Open_Data/json/National.json" \
            -o data/national.json \
            --fail \
            --retry 3 \
            --retry-delay 5

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leinster.json data/national.json
          git diff --cached --quiet || git commit -m "chore: update forecast data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
