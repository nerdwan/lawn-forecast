name: Update mow forecast data

on:
  schedule:
    # Met Éireann updates ~4 times daily (3am, 9am, 3pm, 9pm).
    # Run shortly after each cycle.
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:  # allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and transform Met Éireann forecast
        run: python scripts/fetch_forecast.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          if git diff --cached --quiet; then
            echo "No changes to forecast.json — skipping commit."
          else
            git commit -m "Update forecast data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
